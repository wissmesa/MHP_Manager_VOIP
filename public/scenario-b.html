<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario B: Click-to-Call - Call from Browser to PSTN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #f5576c;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #f5576c;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #e0485c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #7f8c8d;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
            min-height: 60px;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }

        .status.warning {
            background: #fff3e0;
            color: #f57c00;
            border-left: 4px solid #f57c00;
        }

        .call-info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }

        .call-info.active {
            display: block;
        }

        .call-info p {
            margin: 5px 0;
            color: #555;
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .audio-controls button {
            padding: 10px 20px;
            font-size: 14px;
        }

        .stats {
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 12px;
            display: none;
        }

        .stats.active {
            display: block;
        }

        .stats p {
            margin: 3px 0;
            color: #666;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: #f5f5f5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .tab.active {
            background: #f5576c;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Click-to-Call</h1>
        <p class="subtitle">Scenario B: Call from browser to PSTN number</p>

        <div class="tabs">
            <button class="tab active" data-tab="direct">Direct (TwiML)</button>
            <button class="tab" data-tab="studio">With Studio</button>
        </div>

        <!-- Tab 1: Direct Call (TwiML) -->
        <div id="direct" class="tab-content active">
            <div class="input-group">
                <label for="identity1">User Identity:</label>
                <input type="text" id="identity1" value="user123" placeholder="user123">
            </div>

            <div class="input-group">
                <label for="phoneNumber">Phone Number (PSTN):</label>
                <input type="tel" id="phoneNumber" value="+14063445815" placeholder="+14063445815">
            </div>

            <div class="button-group">
                <button id="register1" class="btn-primary">Connect</button>
                <button id="callDirect" class="btn-success" disabled>Call</button>
                <button id="hangup1" class="btn-danger" disabled>Hang Up</button>
            </div>

            <div id="status1" class="status info">
                ⏳ Disconnected. Click "Connect" first.
            </div>

            <div id="callInfo1" class="call-info">
                <p><strong>Active VoIP Call</strong></p>
                <p id="callTo1"></p>
                
                <div class="audio-controls">
                    <button id="muteBtn1" class="btn-secondary" style="flex: 1;">🔇 Mute</button>
                    <button id="unmuteBtn1" class="btn-secondary" style="flex: 1; display: none;">🔊 Unmute</button>
                </div>

                <div id="stats1" class="stats">
                    <p><strong>VoIP Statistics:</strong></p>
                    <p>Codec: <span id="codec1">-</span></p>
                    <p>Status: <span id="callStatus1">-</span></p>
                    <p>Duration: <span id="duration1">00:00</span></p>
                </div>
            </div>
        </div>

        <!-- Tab 2: Call with Studio -->
        <div id="studio" class="tab-content">
            <div class="input-group">
                <label for="identity2">Agent Identity:</label>
                <input type="text" id="identity2" value="agent123" placeholder="agent123">
            </div>

            <div class="input-group">
                <label for="customerPhone">Customer Number (PSTN):</label>
                <input type="tel" id="customerPhone" value="+14063445815" placeholder="+14063445815">
            </div>

            <div class="button-group">
                <button id="register2" class="btn-primary">Connect</button>
                <button id="callStudio" class="btn-success" disabled>Call with Studio</button>
                <button id="hangup2" class="btn-danger" disabled>Hang Up</button>
            </div>

            <div id="status2" class="status info">
                ⏳ Disconnected. Click "Connect" first.
            </div>

            <div id="callInfo2" class="call-info">
                <p><strong>Active VoIP Call</strong></p>
                <p id="callTo2"></p>
                
                <div class="audio-controls">
                    <button id="muteBtn2" class="btn-secondary" style="flex: 1;">🔇 Mute</button>
                    <button id="unmuteBtn2" class="btn-secondary" style="flex: 1; display: none;">🔊 Unmute</button>
                </div>

                <div id="stats2" class="stats">
                    <p><strong>VoIP Statistics:</strong></p>
                    <p>Codec: <span id="codec2">-</span></p>
                    <p>Status: <span id="callStatus2">-</span></p>
                    <p>Duration: <span id="duration2">00:00</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Twilio Voice SDK 2.x from CDN -->
    <!-- Try multiple CDNs in case one fails -->
    <script>
        (function() {
            const CDNs = [
                // SDK 2.x from npm (more reliable)
                'https://unpkg.com/@twilio/voice-sdk@2.7.2/dist/twilio.min.js',
                'https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.7.2/dist/twilio.min.js',
                // Unminified version for debugging
                'https://unpkg.com/@twilio/voice-sdk@2.7.2/dist/twilio.js',
                // Previous versions of SDK 2.x
                'https://unpkg.com/@twilio/voice-sdk@2.6.0/dist/twilio.min.js',
                'https://unpkg.com/@twilio/voice-sdk@2.5.0/dist/twilio.min.js',
                // Official Twilio CDN (may not have 2.x)
                'https://sdk.twilio.com/js/client/releases/2.7.2/twilio.min.js',
                'https://sdk.twilio.com/js/client/releases/2.6.0/twilio.min.js'
            ];
            
            let loaded = false;
            let currentIndex = 0;
            
            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.async = true;
                    script.defer = true;
                    
                    script.onload = () => {
                        console.log(`✅ Script loaded from: ${src}`);
                        // Wait a moment for SDK to initialize
                        setTimeout(() => {
                            if (typeof window.Twilio !== 'undefined' || typeof Twilio !== 'undefined') {
                                loaded = true;
                                resolve();
                            } else {
                                console.warn(`⚠️ Script loaded but Twilio is not available yet`);
                                // Give more time
                                setTimeout(() => {
                                    if (typeof window.Twilio !== 'undefined' || typeof Twilio !== 'undefined') {
                                        loaded = true;
                                        resolve();
                                    } else {
                                        reject(new Error('Twilio did not initialize'));
                                    }
                                }, 1000);
                            }
                        }, 500);
                    };
                    
                    script.onerror = () => {
                        console.warn(`❌ Error loading from: ${src}`);
                        reject(new Error(`Error loading ${src}`));
                    };
                    
                    document.head.appendChild(script);
                });
            }
            
            async function tryLoad() {
                for (let i = 0; i < CDNs.length; i++) {
                    try {
                        await loadScript(CDNs[i]);
                        if (loaded) {
                            console.log(`✅ Twilio SDK loaded successfully from: ${CDNs[i]}`);
                            return;
                        }
                    } catch (error) {
                        console.warn(`⚠️ Attempt ${i + 1} failed:`, error.message);
                        if (i === CDNs.length - 1) {
                            console.error('❌ All CDNs failed');
                        }
                    }
                }
            }
            
            // Load when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', tryLoad);
            } else {
                tryLoad();
            }
        })();
    </script>
    
    <script type="module">
        // Wait for SDK to load completely
        let Device;
        
        // Function to wait for Twilio to be available
        async function waitForTwilio() {
            let attempts = 0;
            const maxAttempts = 100; // 10 seconds maximum
            
            console.log("⏳ Waiting for Twilio SDK to load...");
            
            while (attempts < maxAttempts) {
                // Check multiple ways Twilio can be available
                let TwilioObj = null;
                
                // 1. Check window.Twilio
                if (typeof window !== 'undefined' && window.Twilio) {
                    TwilioObj = window.Twilio;
                    console.log("📦 Twilio found in window.Twilio");
                }
                // 2. Check global Twilio
                else if (typeof Twilio !== 'undefined') {
                    TwilioObj = Twilio;
                    console.log("📦 Twilio found globally");
                }
                // 3. Check if there's any object with Device
                else if (typeof window !== 'undefined') {
                    // Search for any property that might be Twilio
                    for (const key in window) {
                        if (window[key] && typeof window[key] === 'object' && window[key].Device) {
                            TwilioObj = window[key];
                            console.log(`📦 Twilio found in window.${key}`);
                            break;
                        }
                    }
                }
                
                if (TwilioObj) {
                    // Try to get Device in different ways
                    Device = TwilioObj.Device || 
                             TwilioObj.default?.Device || 
                             (TwilioObj.constructor && TwilioObj.constructor.name === 'Device' ? TwilioObj : null);
                    
                    if (Device && typeof Device === 'function') {
                        console.log("✅ Twilio Device available:", typeof Device);
                        console.log("📋 Device constructor:", Device.name || 'anonymous');
                        return Device;
                    } else {
                        console.log("⚠️ Twilio found but Device is not available");
                        console.log("📋 Twilio properties:", Object.keys(TwilioObj));
                    }
                }
                
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
                
                if (attempts % 10 === 0) {
                    console.log(`⏳ Waiting... (${attempts * 100}ms)`);
                    console.log("🔍 Current status:");
                    console.log("  - window.Twilio:", typeof window !== 'undefined' ? typeof window.Twilio : 'N/A');
                    console.log("  - Global Twilio:", typeof Twilio);
                }
            }
            
            console.error("❌ Twilio SDK did not load after 10 seconds");
            console.error("Verify:");
            console.error("1. Your internet connection");
            console.error("2. That Twilio CDN is accessible");
            console.error("3. Browser console for network errors");
            
            throw new Error("Twilio SDK did not load. Verify your internet connection.");
        }
        
        // Wait for SDK to be ready before continuing
        try {
            Device = await waitForTwilio();
        } catch (error) {
            console.error("❌ Fatal error:", error);
            // Show error on page
            document.body.innerHTML = `
                <div style="padding: 20px; text-align: center; font-family: Arial;">
                    <h2>❌ Error loading Twilio SDK</h2>
                    <p>${error.message}</p>
                    <p>Please verify your internet connection and reload the page.</p>
                </div>
            `;
            throw error;
        }

        // Tabs
        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => {
                const tabName = tab.dataset.tab;
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
                tab.classList.add("active");
                document.getElementById(tabName).classList.add("active");
            });
        });

        // ========== TAB 1: Direct Call (TwiML) ==========
        let device1 = null;
        let activeCall1 = null;
        const statusEl1 = document.getElementById("status1");
        const registerBtn1 = document.getElementById("register1");
        const callDirectBtn = document.getElementById("callDirect");
        const hangupBtn1 = document.getElementById("hangup1");
        const identityInput1 = document.getElementById("identity1");
        const phoneInput1 = document.getElementById("phoneNumber");
        const callInfoEl1 = document.getElementById("callInfo1");

        function updateStatus1(message, type = "info") {
            statusEl1.textContent = message;
            statusEl1.className = `status ${type}`;
        }

        async function getToken1(identity) {
            try {
                console.log(`🔑 Getting token for identity: ${identity}`);
                
                // Detect if we're in file:// and use absolute URL
                let baseUrl = '';
                if (window.location.protocol === 'file:') {
                    console.error('❌ ERROR: You are opening the file directly from the file system.');
                    console.error('⚠️ You must access through the server: http://localhost:4040/scenario-b.html');
                    throw new Error('You must access through the server. Open: http://localhost:4040/scenario-b.html');
                }
                
                const url = `${baseUrl}/token?identity=${encodeURIComponent(identity)}`;
                console.log(`📡 URL: ${url}`);
                
                const response = await fetch(url);
                console.log(`📥 Response status: ${response.status}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`❌ Error response:`, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                console.log(`✅ Token received for: ${data.identity}`);
                
                if (!data.token) {
                    throw new Error("Token not received in response");
                }
                
                return data.token;
            } catch (error) {
                console.error(`❌ Complete error:`, error);
                throw new Error(`Error getting token: ${error.message}`);
            }
        }

        registerBtn1.onclick = async () => {
            const identity = identityInput1.value.trim() || "user123";
            
            console.log(`🚀 Starting connection for identity: ${identity}`);
            
            try {
                updateStatus1("⏳ Getting token...", "info");
                registerBtn1.disabled = true;

                const token = await getToken1(identity);
                console.log(`✅ Token obtained, starting device registration...`);

                updateStatus1("⏳ Registering VoIP device...", "info");

                // Optimized configuration for VoIP
                device1 = new Device(token, { 
                    logLevel: 1,
                    // Prioritize Opus for better VoIP quality, then PCMU as fallback
                    codecPreferences: ['opus', 'pcmu'],
                    allowIncomingWhileBusy: false,
                    fakeLocalDTMF: false,
                    enableRTCStats: true
                });

                device1.on("registered", () => {
                    updateStatus1(`✅ Registered as "${identity}" (VoIP active). Ready to make calls.`, "success");
                    registerBtn1.disabled = true;
                    registerBtn1.textContent = "Connected";
                    callDirectBtn.disabled = false;
                });

                device1.on("tokenWillExpire", async () => {
                    updateStatus1("⚠️ Token expiring, renewing...", "warning");
                    try {
                        const newToken = await getToken1(identity);
                        await device1.updateToken(newToken);
                        updateStatus1("✅ Token renewed", "success");
                    } catch (error) {
                        updateStatus1(`❌ Error renewing token: ${error.message}`, "error");
                    }
                });

                device1.on("error", (error) => {
                    updateStatus1(`❌ Error: ${error.message}`, "error");
                    registerBtn1.disabled = false;
                    registerBtn1.textContent = "Connect";
                });

                console.log(`📞 Registering device with Twilio...`);
                await device1.register();
                console.log(`✅ Device registered successfully`);
            } catch (error) {
                console.error(`❌ Error in connection process:`, error);
                updateStatus1(`❌ Error: ${error.message}`, "error");
                registerBtn1.disabled = false;
                registerBtn1.textContent = "Connect";
            }
        };

        callDirectBtn.onclick = async () => {
            const phoneNumber = phoneInput1.value.trim();
            
            if (!phoneNumber) {
                updateStatus1("❌ Please enter a phone number", "error");
                return;
            }

            if (!device1) {
                updateStatus1("❌ You must connect first", "error");
                return;
            }

            try {
                callDirectBtn.disabled = true;
                updateStatus1(`📞 Calling ${phoneNumber}...`, "warning");

                activeCall1 = await device1.connect({
                    params: { To: phoneNumber }
                });

                document.getElementById("callTo1").textContent = `Calling: ${phoneNumber}`;
                callInfoEl1.classList.add("active");
                document.getElementById("stats1").classList.add("active");
                hangupBtn1.disabled = false;

                // Start duration counter
                let startTime1 = Date.now();
                const durationInterval1 = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTime1) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    document.getElementById("duration1").textContent = 
                        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                }, 1000);

                activeCall1.on("accept", () => {
                    updateStatus1(`✅ VoIP call connected to ${phoneNumber}`, "success");
                    document.getElementById("callStatus1").textContent = "Connected";
                    if (activeCall1.codec) {
                        document.getElementById("codec1").textContent = activeCall1.codec.toUpperCase();
                    }
                });

                activeCall1.on("disconnect", () => {
                    clearInterval(durationInterval1);
                    updateStatus1("☎️ VoIP call ended", "info");
                    activeCall1 = null;
                    hangupBtn1.disabled = true;
                    callInfoEl1.classList.remove("active");
                    document.getElementById("stats1").classList.remove("active");
                    callDirectBtn.disabled = false;
                    document.getElementById("muteBtn1").style.display = "block";
                    document.getElementById("unmuteBtn1").style.display = "none";
                });

                activeCall1.on("cancel", () => {
                    clearInterval(durationInterval1);
                    updateStatus1("📵 Call cancelled", "info");
                    activeCall1 = null;
                    hangupBtn1.disabled = true;
                    callInfoEl1.classList.remove("active");
                    document.getElementById("stats1").classList.remove("active");
                    callDirectBtn.disabled = false;
                });

                activeCall1.on("error", (error) => {
                    clearInterval(durationInterval1);
                    console.error("Error in VoIP call:", error);
                    updateStatus1(`❌ Error in call: ${error.message}`, "error");
                });

            } catch (error) {
                updateStatus1(`❌ Error: ${error.message}`, "error");
                callDirectBtn.disabled = false;
            }
        };

        hangupBtn1.onclick = () => {
            if (activeCall1) {
                activeCall1.disconnect();
                activeCall1 = null;
                hangupBtn1.disabled = true;
                callInfoEl1.classList.remove("active");
                document.getElementById("stats1").classList.remove("active");
                callDirectBtn.disabled = false;
            }
        };

        // VoIP audio controls - Tab 1
        const muteBtn1 = document.getElementById("muteBtn1");
        const unmuteBtn1 = document.getElementById("unmuteBtn1");

        muteBtn1.onclick = () => {
            if (activeCall1) {
                activeCall1.mute(true);
                muteBtn1.style.display = "none";
                unmuteBtn1.style.display = "block";
            }
        };

        unmuteBtn1.onclick = () => {
            if (activeCall1) {
                activeCall1.mute(false);
                muteBtn1.style.display = "block";
                unmuteBtn1.style.display = "none";
            }
        };

        // ========== TAB 2: Call with Studio ==========
        let device2 = null;
        let activeCall2 = null;
        const statusEl2 = document.getElementById("status2");
        const registerBtn2 = document.getElementById("register2");
        const callStudioBtn = document.getElementById("callStudio");
        const hangupBtn2 = document.getElementById("hangup2");
        const identityInput2 = document.getElementById("identity2");
        const customerPhoneInput = document.getElementById("customerPhone");
        const callInfoEl2 = document.getElementById("callInfo2");

        function updateStatus2(message, type = "info") {
            statusEl2.textContent = message;
            statusEl2.className = `status ${type}`;
        }

        async function getToken2(identity) {
            try {
                // Detect if we're in file://
                if (window.location.protocol === 'file:') {
                    throw new Error('You must access through the server. Open: http://localhost:4040/scenario-b.html');
                }
                
                const response = await fetch(`/token?identity=${encodeURIComponent(identity)}`);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Error getting token");
                }
                return data.token;
            } catch (error) {
                throw new Error(`Error getting token: ${error.message}`);
            }
        }

        registerBtn2.onclick = async () => {
            const identity = identityInput2.value.trim() || "agent123";
            
            try {
                updateStatus2("⏳ Getting token...", "info");
                registerBtn2.disabled = true;

                const token = await getToken2(identity);

                updateStatus2("⏳ Registering device...", "info");

                // Optimized configuration for VoIP
                device2 = new Device(token, { 
                    logLevel: 1,
                    codecPreferences: ['opus', 'pcmu'],
                    allowIncomingWhileBusy: false,
                    fakeLocalDTMF: false,
                    enableRTCStats: true
                });

                device2.on("registered", () => {
                    updateStatus2(`✅ Registered as "${identity}" (VoIP active). Ready for Studio calls.`, "success");
                    registerBtn2.disabled = true;
                    registerBtn2.textContent = "Connected";
                    callStudioBtn.disabled = false;
                });

                device2.on("tokenWillExpire", async () => {
                    updateStatus2("⚠️ Token expiring, renewing...", "warning");
                    try {
                        const newToken = await getToken2(identity);
                        await device2.updateToken(newToken);
                        updateStatus2("✅ Token renewed", "success");
                    } catch (error) {
                        updateStatus2(`❌ Error renewing token: ${error.message}`, "error");
                    }
                });

                device2.on("error", (error) => {
                    updateStatus2(`❌ Error: ${error.message}`, "error");
                    registerBtn2.disabled = false;
                    registerBtn2.textContent = "Connect";
                });

                device2.on("incoming", (call) => {
                    updateStatus2("📞 Incoming VoIP call from Studio...", "warning");
                    activeCall2 = call;
                    hangupBtn2.disabled = false;

                    document.getElementById("callTo2").textContent = `Call from Studio`;
                    callInfoEl2.classList.add("active");
                    document.getElementById("stats2").classList.add("active");

                    call.accept();
                    updateStatus2("✅ VoIP call connected", "success");

                    // Start duration counter
                    let startTime2 = Date.now();
                    const durationInterval2 = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - startTime2) / 1000);
                        const minutes = Math.floor(elapsed / 60);
                        const seconds = elapsed % 60;
                        document.getElementById("duration2").textContent = 
                            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    }, 1000);

                    call.on("accept", () => {
                        updateStatus2("✅ VoIP call accepted", "success");
                        document.getElementById("callStatus2").textContent = "Connected";
                        if (call.codec) {
                            document.getElementById("codec2").textContent = call.codec.toUpperCase();
                        }
                    });

                    call.on("disconnect", () => {
                        clearInterval(durationInterval2);
                        updateStatus2("☎️ VoIP call ended", "info");
                        activeCall2 = null;
                        hangupBtn2.disabled = true;
                        callInfoEl2.classList.remove("active");
                        document.getElementById("stats2").classList.remove("active");
                        document.getElementById("muteBtn2").style.display = "block";
                        document.getElementById("unmuteBtn2").style.display = "none";
                    });

                    call.on("cancel", () => {
                        clearInterval(durationInterval2);
                        updateStatus2("📵 Call cancelled", "info");
                        activeCall2 = null;
                        hangupBtn2.disabled = true;
                        callInfoEl2.classList.remove("active");
                        document.getElementById("stats2").classList.remove("active");
                    });

                    call.on("reject", () => {
                        clearInterval(durationInterval2);
                        updateStatus2("❌ Call rejected", "error");
                        activeCall2 = null;
                        hangupBtn2.disabled = true;
                        callInfoEl2.classList.remove("active");
                        document.getElementById("stats2").classList.remove("active");
                    });

                    call.on("error", (error) => {
                        clearInterval(durationInterval2);
                        console.error("Error in VoIP call:", error);
                        updateStatus2(`❌ Error in call: ${error.message}`, "error");
                    });
                });

                await device2.register();
            } catch (error) {
                updateStatus2(`❌ Error: ${error.message}`, "error");
                registerBtn2.disabled = false;
                registerBtn2.textContent = "Connect";
            }
        };

        callStudioBtn.onclick = async () => {
            const identity = identityInput2.value.trim() || "agent123";
            const customerPhone = customerPhoneInput.value.trim();
            
            if (!customerPhone) {
                updateStatus2("❌ Please enter the customer number", "error");
                return;
            }

            try {
                callStudioBtn.disabled = true;
                updateStatus2("⏳ Triggering Studio Flow...", "info");

                const response = await fetch("/studio/execute", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        identity: identity,
                        to: customerPhone, // Customer number
                        from: undefined,
                        parameters: {
                            agent: identity,
                            customer: customerPhone
                        }
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    updateStatus2(`✅ Studio Flow executed. You should receive a call soon connecting you with ${customerPhone}. Execution SID: ${data.executionSid}`, "success");
                    document.getElementById("callTo2").textContent = `Connecting with: ${customerPhone}`;
                    callInfoEl2.classList.add("active");
                } else {
                    updateStatus2(`❌ Error: ${data.error || "Unknown error"}`, "error");
                }
            } catch (error) {
                updateStatus2(`❌ Error: ${error.message}`, "error");
            } finally {
                callStudioBtn.disabled = false;
            }
        };

        hangupBtn2.onclick = () => {
            if (activeCall2) {
                activeCall2.disconnect();
                activeCall2 = null;
                hangupBtn2.disabled = true;
                callInfoEl2.classList.remove("active");
                document.getElementById("stats2").classList.remove("active");
            }
        };

        // VoIP audio controls - Tab 2
        const muteBtn2 = document.getElementById("muteBtn2");
        const unmuteBtn2 = document.getElementById("unmuteBtn2");

        muteBtn2.onclick = () => {
            if (activeCall2) {
                activeCall2.mute(true);
                muteBtn2.style.display = "none";
                unmuteBtn2.style.display = "block";
            }
        };

        unmuteBtn2.onclick = () => {
            if (activeCall2) {
                activeCall2.mute(false);
                muteBtn2.style.display = "block";
                unmuteBtn2.style.display = "none";
            }
        };
    </script>
</body>
</html>
