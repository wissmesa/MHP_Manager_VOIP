<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario A: Softphone - Receive Calls from Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #7f8c8d;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
            min-height: 60px;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }

        .status.warning {
            background: #fff3e0;
            color: #f57c00;
            border-left: 4px solid #f57c00;
        }

        .call-info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }

        .call-info.active {
            display: block;
        }

        .call-info p {
            margin: 5px 0;
            color: #555;
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .audio-controls button {
            padding: 10px 20px;
            font-size: 14px;
        }

        .stats {
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 12px;
            display: none;
        }

        .stats.active {
            display: block;
        }

        .stats p {
            margin: 3px 0;
            color: #666;
        }

        .codec-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📞 Softphone - Web Agent</h1>
        <p class="subtitle">Scenario A: Receive calls from Studio Flow</p>

        <div class="input-group">
            <label for="identity">Agent Identity:</label>
            <input type="text" id="identity" value="agent123" placeholder="agent123">
        </div>

        <div class="button-group">
            <button id="register" class="btn-primary">Connect</button>
            <button id="hangup" class="btn-danger" disabled>Hang Up</button>
        </div>

        <button id="testStudio" class="btn-secondary" style="width: 100%; margin-bottom: 20px;" disabled>
            Test Call from Studio
        </button>

        <div id="status" class="status info">
            ⏳ Disconnected. Click "Connect" to register.
        </div>

        <div id="callInfo" class="call-info">
            <p><strong>Active VoIP Call</strong></p>
            <p id="callFrom"></p>
            <p id="callTo"></p>
            
            <div class="audio-controls">
                <button id="muteBtn" class="btn-secondary" style="flex: 1;">🔇 Mute</button>
                <button id="unmuteBtn" class="btn-secondary" style="flex: 1; display: none;">🔊 Unmute</button>
            </div>

            <div id="stats" class="stats">
                <p><strong>VoIP Statistics:</strong></p>
                <p>Codec: <span id="codec">-</span></p>
                <p>Status: <span id="callStatus">-</span></p>
                <p>Duration: <span id="duration">00:00</span></p>
            </div>
        </div>
    </div>

    <!-- Load Twilio Voice SDK 2.x from CDN -->
    <!-- Try multiple CDNs in case one fails -->
    <script>
        (function() {
            const CDNs = [
                // SDK 2.x from npm (more reliable)
                'https://unpkg.com/@twilio/voice-sdk@2.7.2/dist/twilio.min.js',
                'https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.7.2/dist/twilio.min.js',
                // Unminified version for debugging
                'https://unpkg.com/@twilio/voice-sdk@2.7.2/dist/twilio.js',
                // Previous versions of SDK 2.x
                'https://unpkg.com/@twilio/voice-sdk@2.6.0/dist/twilio.min.js',
                'https://unpkg.com/@twilio/voice-sdk@2.5.0/dist/twilio.min.js',
                // Official Twilio CDN (may not have 2.x)
                'https://sdk.twilio.com/js/client/releases/2.7.2/twilio.min.js',
                'https://sdk.twilio.com/js/client/releases/2.6.0/twilio.min.js'
            ];
            
            let loaded = false;
            let currentIndex = 0;
            
            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.async = true;
                    script.defer = true;
                    
                    script.onload = () => {
                        console.log(`✅ Script loaded from: ${src}`);
                        // Wait a moment for SDK to initialize
                        setTimeout(() => {
                            if (typeof window.Twilio !== 'undefined' || typeof Twilio !== 'undefined') {
                                loaded = true;
                                resolve();
                            } else {
                                console.warn(`⚠️ Script loaded but Twilio is not available yet`);
                                // Give more time
                                setTimeout(() => {
                                    if (typeof window.Twilio !== 'undefined' || typeof Twilio !== 'undefined') {
                                        loaded = true;
                                        resolve();
                                    } else {
                                        reject(new Error('Twilio did not initialize'));
                                    }
                                }, 1000);
                            }
                        }, 500);
                    };
                    
                    script.onerror = () => {
                        console.warn(`❌ Error loading from: ${src}`);
                        reject(new Error(`Error loading ${src}`));
                    };
                    
                    document.head.appendChild(script);
                });
            }
            
            async function tryLoad() {
                for (let i = 0; i < CDNs.length; i++) {
                    try {
                        await loadScript(CDNs[i]);
                        if (loaded) {
                            console.log(`✅ Twilio SDK loaded successfully from: ${CDNs[i]}`);
                            return;
                        }
                    } catch (error) {
                        console.warn(`⚠️ Attempt ${i + 1} failed:`, error.message);
                        if (i === CDNs.length - 1) {
                            console.error('❌ All CDNs failed');
                        }
                    }
                }
            }
            
            // Load when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', tryLoad);
            } else {
                tryLoad();
            }
        })();
    </script>
    
    <script>
        // Verify access through server
        if (window.location.protocol === 'file:') {
            document.body.innerHTML = `
                <div style="padding: 40px; text-align: center; font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto;">
                    <h1 style="color: #e74c3c;">❌ Access Error</h1>
                    <p style="font-size: 18px; color: #555; margin: 20px 0;">
                        You are opening the file directly from the file system.
                    </p>
                    <p style="font-size: 16px; color: #777; margin: 20px 0;">
                        For it to work correctly, you must access through the server:
                    </p>
                    <div style="background: #f5f5f5; padding: 20px; border-radius: 8px; margin: 20px 0;">
                        <p style="font-size: 20px; font-weight: bold; color: #667eea;">
                            <a href="http://localhost:4040/scenario-a.html" style="color: #667eea; text-decoration: none;">
                                http://localhost:4040/scenario-a.html
                            </a>
                        </p>
                    </div>
                    <p style="font-size: 14px; color: #999; margin-top: 30px;">
                        Make sure the server is running: <code>npm start</code>
                    </p>
                </div>
            `;
        }
    </script>
    
    <script type="module">
        // Wait for SDK to load completely
        let Device;
        
        // Function to wait for Twilio to be available
        async function waitForTwilio() {
            let attempts = 0;
            const maxAttempts = 100; // 10 seconds maximum
            
            console.log("⏳ Waiting for Twilio SDK to load...");
            
            while (attempts < maxAttempts) {
                // Check multiple ways Twilio can be available
                let TwilioObj = null;
                
                // 1. Check window.Twilio
                if (typeof window !== 'undefined' && window.Twilio) {
                    TwilioObj = window.Twilio;
                    console.log("📦 Twilio found in window.Twilio");
                }
                // 2. Check global Twilio
                else if (typeof Twilio !== 'undefined') {
                    TwilioObj = Twilio;
                    console.log("📦 Twilio found globally");
                }
                // 3. Check if there's any object with Device
                else if (typeof window !== 'undefined') {
                    // Search for any property that might be Twilio
                    for (const key in window) {
                        if (window[key] && typeof window[key] === 'object' && window[key].Device) {
                            TwilioObj = window[key];
                            console.log(`📦 Twilio found in window.${key}`);
                            break;
                        }
                    }
                }
                
                if (TwilioObj) {
                    // Try to get Device in different ways
                    Device = TwilioObj.Device || 
                             TwilioObj.default?.Device || 
                             (TwilioObj.constructor && TwilioObj.constructor.name === 'Device' ? TwilioObj : null);
                    
                    if (Device && typeof Device === 'function') {
                        console.log("✅ Twilio Device available:", typeof Device);
                        console.log("📋 Device constructor:", Device.name || 'anonymous');
                        return Device;
                    } else {
                        console.log("⚠️ Twilio found but Device is not available");
                        console.log("📋 Twilio properties:", Object.keys(TwilioObj));
                    }
                }
                
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
                
                if (attempts % 10 === 0) {
                    console.log(`⏳ Waiting... (${attempts * 100}ms)`);
                    console.log("🔍 Current status:");
                    console.log("  - window.Twilio:", typeof window !== 'undefined' ? typeof window.Twilio : 'N/A');
                    console.log("  - Global Twilio:", typeof Twilio);
                }
            }
            
            console.error("❌ Twilio SDK did not load after 10 seconds");
            console.error("Verify:");
            console.error("1. Your internet connection");
            console.error("2. That Twilio CDN is accessible");
            console.error("3. Browser console for network errors");
            
            throw new Error("Twilio SDK did not load. Verify your internet connection.");
        }
        
        // Wait for SDK to be ready before continuing
        try {
            Device = await waitForTwilio();
        } catch (error) {
            console.error("❌ Fatal error:", error);
            // Show error on page
            document.body.innerHTML = `
                <div style="padding: 20px; text-align: center; font-family: Arial;">
                    <h2>❌ Error loading Twilio SDK</h2>
                    <p>${error.message}</p>
                    <p>Please verify your internet connection and reload the page.</p>
                </div>
            `;
            throw error;
        }

        let device = null;
        let activeCall = null;
        const statusEl = document.getElementById("status");
        const registerBtn = document.getElementById("register");
        const hangupBtn = document.getElementById("hangup");
        const testStudioBtn = document.getElementById("testStudio");
        const identityInput = document.getElementById("identity");
        const callInfoEl = document.getElementById("callInfo");

        function updateStatus(message, type = "info") {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        async function getToken(identity) {
            try {
                // Detect if we're in file://
                if (window.location.protocol === 'file:') {
                    throw new Error('You must access through the server. Open: http://localhost:4040/scenario-a.html');
                }
                
                const response = await fetch(`/token?identity=${encodeURIComponent(identity)}`);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Error getting token");
                }
                return data.token;
            } catch (error) {
                throw new Error(`Error getting token: ${error.message}`);
            }
        }

        registerBtn.onclick = async () => {
            const identity = identityInput.value.trim() || "agent123";
            
            if (!identity) {
                updateStatus("❌ Please enter an identity", "error");
                return;
            }

            try {
                updateStatus("⏳ Getting token...", "info");
                registerBtn.disabled = true;

                const token = await getToken(identity);

                updateStatus("⏳ Registering device...", "info");

                // Optimized configuration for VoIP
                device = new Device(token, { 
                    logLevel: 1, // Logs for debugging
                    // Prioritize Opus for better VoIP quality, then PCMU as fallback
                    codecPreferences: ['opus', 'pcmu'],
                    // Allow incoming calls while one is active
                    allowIncomingWhileBusy: false,
                    // Audio configuration
                    fakeLocalDTMF: false,
                    // Enable call statistics
                    enableRTCStats: true
                });

                device.on("registered", () => {
                    updateStatus(`✅ Registered as "${identity}" (VoIP active). Ready to receive calls from Studio.`, "success");
                    registerBtn.disabled = true;
                    registerBtn.textContent = "Connected";
                    testStudioBtn.disabled = false;
                });

                // Additional events for better VoIP handling
                device.on("tokenWillExpire", async () => {
                    updateStatus("⚠️ Token expiring, renewing...", "warning");
                    try {
                        const newToken = await getToken(identity);
                        await device.updateToken(newToken);
                        updateStatus("✅ Token renewed", "success");
                    } catch (error) {
                        updateStatus(`❌ Error renewing token: ${error.message}`, "error");
                    }
                });

                device.on("error", (error) => {
                    console.error("VoIP device error:", error);
                    updateStatus(`❌ VoIP error: ${error.message}`, "error");
                    registerBtn.disabled = false;
                    registerBtn.textContent = "Connect";
                });

                device.on("incoming", (call) => {
                    updateStatus("📞 Incoming VoIP call from Studio...", "warning");
                    activeCall = call;
                    hangupBtn.disabled = false;

                    // Show call information
                    document.getElementById("callFrom").textContent = `From: ${call.from || "Studio Flow"}`;
                    document.getElementById("callTo").textContent = `To: ${call.to || identity}`;
                    callInfoEl.classList.add("active");
                    document.getElementById("stats").classList.add("active");

                    // Accept automatically (you can change this to show accept/reject UI)
                    call.accept();
                    updateStatus("✅ VoIP call connected", "success");

                    // Start duration counter
                    let startTime = Date.now();
                    const durationInterval = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - startTime) / 1000);
                        const minutes = Math.floor(elapsed / 60);
                        const seconds = elapsed % 60;
                        document.getElementById("duration").textContent = 
                            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    }, 1000);

                    // VoIP call events
                    call.on("accept", () => {
                        updateStatus("✅ VoIP call accepted", "success");
                        document.getElementById("callStatus").textContent = "Connected";
                        
                        // Get codec information
                        if (call.codec) {
                            document.getElementById("codec").textContent = call.codec.toUpperCase();
                        }
                    });

                    call.on("disconnect", () => {
                        clearInterval(durationInterval);
                        updateStatus(`☎️ VoIP call ended. Ready to receive new calls.`, "info");
                        activeCall = null;
                        hangupBtn.disabled = true;
                        callInfoEl.classList.remove("active");
                        document.getElementById("stats").classList.remove("active");
                        document.getElementById("muteBtn").style.display = "block";
                        document.getElementById("unmuteBtn").style.display = "none";
                    });

                    call.on("cancel", () => {
                        clearInterval(durationInterval);
                        updateStatus("📵 Call cancelled", "info");
                        activeCall = null;
                        hangupBtn.disabled = true;
                        callInfoEl.classList.remove("active");
                        document.getElementById("stats").classList.remove("active");
                    });

                    call.on("reject", () => {
                        clearInterval(durationInterval);
                        updateStatus("❌ Call rejected", "error");
                        activeCall = null;
                        hangupBtn.disabled = true;
                        callInfoEl.classList.remove("active");
                        document.getElementById("stats").classList.remove("active");
                    });

                    // Call error handling
                    call.on("error", (error) => {
                        console.error("Error in VoIP call:", error);
                        updateStatus(`❌ Error in call: ${error.message}`, "error");
                    });
                });

                await device.register();
            } catch (error) {
                updateStatus(`❌ Error: ${error.message}`, "error");
                registerBtn.disabled = false;
                registerBtn.textContent = "Connect";
            }
        };

        hangupBtn.onclick = () => {
            if (activeCall) {
                activeCall.disconnect();
                activeCall = null;
                hangupBtn.disabled = true;
                callInfoEl.classList.remove("active");
                document.getElementById("stats").classList.remove("active");
            }
        };

        // VoIP audio controls
        const muteBtn = document.getElementById("muteBtn");
        const unmuteBtn = document.getElementById("unmuteBtn");

        muteBtn.onclick = () => {
            if (activeCall) {
                activeCall.mute(true);
                muteBtn.style.display = "none";
                unmuteBtn.style.display = "block";
            }
        };

        unmuteBtn.onclick = () => {
            if (activeCall) {
                activeCall.mute(false);
                muteBtn.style.display = "block";
                unmuteBtn.style.display = "none";
            }
        };

        testStudioBtn.onclick = async () => {
            const identity = identityInput.value.trim() || "agent123";
            
            try {
                testStudioBtn.disabled = true;
                updateStatus("⏳ Triggering Studio Flow...", "info");

                const response = await fetch("/studio/execute", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        identity: identity,
                        from: undefined, // Will use TWILIO_CALLER_ID from .env
                        parameters: {
                            identity: identity
                        }
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    updateStatus(`✅ Studio Flow executed. You should receive a call soon. Execution SID: ${data.executionSid}`, "success");
                } else {
                    updateStatus(`❌ Error: ${data.error || "Unknown error"}`, "error");
                }
            } catch (error) {
                updateStatus(`❌ Error: ${error.message}`, "error");
            } finally {
                testStudioBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
